[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automatic-trade"
version = "0.1.0"
description = "A DQN research environment for cryptocurrency trading"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

